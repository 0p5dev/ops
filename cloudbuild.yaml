steps:
  # Build the Go binary
  - id: Build go binary
    name: golang:1.25-trixie
    secretEnv:
      - NUXT_PUBLIC_SUPABASE_API_KEY
      - NUXT_PUBLIC_SUPABASE_URL
    entrypoint: "go"
    args:
      - "build"
      - "-ldflags"
      - "-X github.com/0p5dev/ops/internal/config.SupabaseURL=$$NUXT_PUBLIC_SUPABASE_URL -X github.com/0p5dev/ops/internal/config.SupabaseKey=$$NUXT_PUBLIC_SUPABASE_API_KEY"
      - "-o"
      - "ops_linux_amd64"
      - "."
    env:
      - "GOOS=linux"
      - "CGO_ENABLED=0"
      - "GOARCH=amd64"

  # Compress the binary into a .tgz file
  - id: Compress binary
    name: alpine:latest
    entrypoint: "sh"
    args:
      - "-c"
      - |
        tar -czf ops_linux_amd64.tgz ops_linux_amd64

  # Retrieve the github access token from Secret Manager and inject it as an env variable
  - id: Retrieve GitHub access Token
    name: gcr.io/cloud-builders/gcloud
    entrypoint: "bash"
    args:
      - "-c"
      - |
        GITHUB_ACCESS_TOKEN=$(gcloud secrets versions access latest --secret="ops-github-access-token")
        echo "export GITHUB_ACCESS_TOKEN=$$GITHUB_ACCESS_TOKEN" >> /workspace/env.sh

  # Create new github release and upload the built binary as release asset
  - id: Create GitHub Release
    name: gcr.io/cloud-builders/gcloud
    entrypoint: "bash"
    args:
      - "-c"
      - |
        apt-get update && apt-get install -y curl jq
        source /workspace/env.sh
        RELEASE_RESPONSE=$$(curl --http1.1 -X POST https://api.github.com/repos/0p5dev/ops/releases -H "Authorization: token $$GITHUB_ACCESS_TOKEN" -H "Content-Type: application/json" -d '{"tag_name":"$TAG_NAME","name":"$TAG_NAME","draft":false,"prerelease":true}')
        UPLOAD_URL=$$(echo $$RELEASE_RESPONSE | jq -r '.upload_url' | sed 's/{?name,label}//')
        curl --http1.1 -X POST "$$UPLOAD_URL?name=ops_linux_amd64.tgz" -H "Authorization: token $$GITHUB_ACCESS_TOKEN" -H "Content-Type: application/octet-stream" --data-binary "@/workspace/ops_linux_amd64.tgz"

serviceAccount: projects/local-first-476300/serviceAccounts/cloud-build-sa@local-first-476300.iam.gserviceaccount.com

options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY

tags:
  - development
  - ops
  - cli

availableSecrets:
  secretManager:
    - versionName: projects/160851347747/secrets/ops-controller-supabase-url/versions/1
      env: "NUXT_PUBLIC_SUPABASE_URL"
    - versionName: projects/160851347747/secrets/ops-controller-supabase-anon-public-key/versions/1
      env: "NUXT_PUBLIC_SUPABASE_API_KEY"
