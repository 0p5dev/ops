steps:
  # Setup the workspace so we have a viable place to point GOPATH at.
  - name: gcr.io/cloud-builders/go
    env: ["PROJECT_ROOT=github.com/0p5dev/ops"]
    args: ["env"]

  # Create github release.
  - name: goreleaser/goreleaser
    entrypoint: /bin/sh
    dir: gopath/src/github.com
    env: ["GOPATH=/workspace/gopath"]
    args: ["-c", "cd 0p5dev/ops && git tag $TAG_NAME && goreleaser"]
    secretEnv:
      - SUPABASE_URL
      - SUPABASE_API_KEY
      - GITHUB_TOKEN

serviceAccount: projects/local-first-476300/serviceAccounts/cloud-build-sa@local-first-476300.iam.gserviceaccount.com

options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY

tags:
  - development
  - ops
  - cli

availableSecrets:
  secretManager:
    - versionName: projects/160851347747/secrets/ops-controller-supabase-url/versions/1
      env: "SUPABASE_URL"
    - versionName: projects/160851347747/secrets/ops-controller-supabase-anon-public-key/versions/1
      env: "SUPABASE_API_KEY"
    - versionName: projects/160851347747/secrets/ops-github-access-token/versions/1
      env: "GITHUB_TOKEN"
